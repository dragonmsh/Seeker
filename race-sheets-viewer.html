<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Sheets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            padding: 20px;
            line-height: 1.4;
        }
        
        .race-selector {
            max-width: 1200px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .race-button {
            background: linear-gradient(to bottom, #2a2a3e 0%, #1f1f2e 100%);
            border: 2px solid #8b6914;
            color: #ffd700;
            padding: 12px 24px;
            font-size: 1em;
            cursor: pointer;
            border-radius: 5px;
            font-family: 'Georgia', serif;
            transition: all 0.3s;
        }
        
        .race-button:hover {
            background: linear-gradient(to bottom, #3a3a4e 0%, #2f2f3e 100%);
            border-color: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(139, 105, 20, 0.4);
        }
        
        .race-button.active {
            background: linear-gradient(90deg, #8b6914, #6d5411);
            border-color: #ffd700;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #2a2a3e 0%, #1f1f2e 100%);
            border: 3px solid #8b6914;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(139, 105, 20, 0.3);
        }
        
        .header {
            text-align: center;
            border-bottom: 3px solid #8b6914;
            padding-bottom: 20px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, transparent, rgba(139, 105, 20, 0.2), transparent);
        }
        
        .race-name {
            font-size: 3em;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        .race-size {
            font-size: 1.3em;
            color: #87ceeb;
            letter-spacing: 2px;
        }
        
        .description {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-left: 4px solid #8b6914;
            margin: 20px 0;
            font-style: italic;
            font-size: 1.05em;
            white-space: pre-wrap;
        }
        
        .section {
            margin: 25px 0;
        }
        
        .section-title {
            font-size: 1.8em;
            color: #ffd700;
            border-bottom: 2px solid #8b6914;
            padding-bottom: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .section-title::before {
            content: "⚡";
            margin-right: 10px;
            font-size: 0.9em;
        }
        
        .trait-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        
        .trait {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid #8b6914;
            border-radius: 5px;
            padding: 15px;
        }
        
        .trait-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .trait-name {
            font-size: 1.3em;
            color: #ffd700;
            font-weight: bold;
        }
        
        .trait-type {
            background: #8b6914;
            padding: 4px 12px;
            border-radius: 3px;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .trait-type.modification { background: #4169e1; }
        .trait-type.ability { background: #900044; }
        .trait-type.advantage { background: #030288; }
        .trait-type.enhancement { background: #8d6650; }
        .trait-type.disadvantage { background: #4c5539; }
        .trait-type.negative { background: #dc143c; }
        
        .trait-description {
            margin-top: 8px;
            line-height: 1.6;
        }
        
        .trait-effect {
            margin-top: 10px;
            padding: 10px;
            background: rgba(139, 105, 20, 0.2);
            border-left: 3px solid #ffd700;
            font-weight: bold;
            color: #87ceeb;
        }
        
        .stat-bonuses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #8b6914;
            padding: 15px;
            text-align: center;
            border-radius: 5px;
        }
        
        .stat-name {
            font-size: 1.2em;
            color: #ffd700;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 2em;
            color: #87ceeb;
            font-weight: bold;
        }
        
        .stat-value.negative {
            color: #ff6b6b;
        }
        
        .stat-description {
            margin-top: 10px;
            font-size: 0.9em;
            color: #cccccc;
        }
        
        @media (max-width: 768px) {
            .race-name {
                font-size: 2em;
            }
            
            .race-selector {
                gap: 5px;
            }
            
            .race-button {
                padding: 8px 16px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
